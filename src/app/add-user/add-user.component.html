<div class="container mt-5">
  <h2>Yeni Kullanıcı Ekle</h2>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">E-posta</label>
      <input type="email" id="email" formControlName="email" class="form-control"
        [ngClass]="{'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched}" />
      <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="invalid-feedback">
        Geçerli bir e-posta adresi giriniz.
      </div>
    </div>

    <!-- Şifre -->
    <div class="mb-3">
      <label for="password" class="form-label">Şifre</label>
      <input type="password" id="password" formControlName="password" class="form-control"
        [ngClass]="{'is-invalid': userForm.get('password')?.invalid && userForm.get('password')?.touched}" />
      <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="invalid-feedback">
        Şifre en az 8 karakter olmalıdır.
      </div>
    </div>

    <!-- Rol -->
    <div class="mb-3">
      <label for="role" class="form-label">Rol</label>
      <select id="role" formControlName="userRole" class="form-select"
        [ngClass]="{'is-invalid': userForm.get('userRole')?.invalid && userForm.get('userRole')?.touched}">
        <option value="" disabled selected>Rol seçiniz</option>
        <option value="User">User</option>
        <option value="Admin">Admin</option>
      </select>
      <div *ngIf="userForm.get('userRole')?.invalid && userForm.get('userRole')?.touched" class="invalid-feedback">
        Lütfen bir rol seçiniz.
      </div>
    </div>

    <!-- Butonlar -->
    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success" [disabled]="userForm.invalid">
        Kaydet
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        İptal
      </button>
    </div>

    <!-- Uyarı Mesajı -->
    <div *ngIf="alertMessage" class="mt-3 alert" [ngClass]="alertClass">
      {{ alertMessage }}
    </div>
  </form>
</div>
