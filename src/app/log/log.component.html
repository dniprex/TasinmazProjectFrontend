<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log İşlemleri</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .table-responsive {
      margin-top: 0; 
      padding-top: 0;
    }

    .table-striped tbody tr:nth-of-type(even) {
      background-color: #f8f9fa; /* Açık gri */
    }
    
    .table-striped tbody tr:nth-of-type(odd) {
      background-color: white; /* Beyaz */
    }
    
    .table-striped td {
      color: #212529; /* Siyah yazı rengi */
    }

    .pagination .page-item .page-link {
      background-color: #f0f0f0; /* Açık gri renk */
      color: #000; /* Siyah yazı */
      border: 1px solid #ccc; /* Gri kenarlık */
    }

    .pagination .page-item.active .page-link {
      background-color: #d9d9d9; /* Daha koyu gri renk */
      border-color: #bbb; /* Daha koyu kenarlık */
      color: #000; /* Siyah yazı */
    }

    .pagination .page-item.disabled .page-link {
      background-color: #e9ecef; /* Pasifler için gri */
      color: #6c757d; /* Daha açık gri yazı */
    }

    .logout-button {
      background-color: white;
      color: black;
      border: 1px solid #ccc;
      padding: 5px 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .logout-button:hover {
      background-color: #f8f8f8;
      color: #000;
      border-color: #bbb;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand">Log İşlemleri</a>
      <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/ana-menu">Mevcut Taşınmazlar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" routerLink="/log">Log İşlemleri</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/users">Kullanıcı İşlemleri</a>
          </li>
        </ul>
        <button class="logout-button" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i> Çıkış Yap
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-5 pt-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between mb-3">
          <h3 class="mb-0">Log İşlemleri</h3>
          <button class="btn btn-success" (click)="exportToExcel()">
            <i class="fas fa-file-excel"></i> Excel'e Aktar
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark text-center">
              <tr>
                <th>Kullanıcı Mail</th>
                <th>Durum</th>
                <th>İşlem Tipi</th>
                <th>Açıklama</th>
                <th>Tarih</th>
                <th>Saat</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let log of pagedLogs" class="text-center">
                <td>{{ log.userMail }}</td>  
                <td>{{ log.durum }}</td>
                <td>{{ log.islemTip }}</td>
                <td>{{ log.aciklama }}</td>
                <td>{{ log.tarihSaat | date: 'dd-MM-yyyy' }}</td>
                <td>{{ log.tarihSaat | date: 'HH:mm:ss' }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <nav class="d-flex justify-content-center">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <button class="page-link" (click)="onPageChange(currentPage - 1)">Önceki</button>
            </li>
            <li class="page-item" *ngFor="let page of getPages()" [class.active]="currentPage === page">
              <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <button class="page-link" (click)="onPageChange(currentPage + 1)">Sonraki</button>
            </li>
          </ul>
        </nav>
        
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>

</html>
