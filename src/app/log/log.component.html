<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log İşlemleri</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand">Log İşlemleri</a>
      <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <!-- Admin değilse buton devre dışı -->
            <a class="nav-link " aria-current="page" routerLink='/ana-menu' >
              Mevcut Taşınmazlar
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" routerLink='/log' >
              Log İşlemleri
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink='/users' >
              Kullanıcı İşlemleri
            </a>
          </li>
        </ul>
        <button class="logout-button" (click)="logout()">
          <i class="fas fa-sign-out-alt"></i> Çıkış Yap
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-5 pt-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Log İşlemleri</h3>

        <div class="table-responsive">
          <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark text-center">
              <tr>
                <th>Kullanıcı Mail</th>
                <th>Durum</th>
                <th>İşlem Tipi</th>
                <th>Açıklama</th>
                <th>Tarih</th>
                <th>Saat</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let log of pagedLogs" class="text-center">
                <td>{{ log.userMail }}</td>  
                <td>{{ log.durum }}</td>
                <td>{{ log.islemTip }}</td>
                <td>{{ log.aciklama }}</td>
                <td>{{ log.tarihSaat | date: 'shortDate' }}</td>
                <td>{{ log.tarihSaat | date: 'shortTime' }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <nav class="d-flex justify-content-center">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <button class="page-link" (click)="onPageChange(currentPage - 1)">Önceki</button>
            </li>
            <li class="page-item" *ngFor="let page of getPages()" [class.active]="currentPage === page">
              <button class="page-link" (click)="onPageChange(page)">{{ page }}</button>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <button class="page-link" (click)="onPageChange(currentPage + 1)">Sonraki</button>
            </li>
          </ul>
        </nav>
        
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>

</html>
